name: Pre-commit checks

on: push

jobs:
  pre-commit-checks:
    name: Checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install Python virtualenv
        uses: ./.github/actions/venv-install
        with:
          python-version: '3.13'
      - name: Add flake8 annotator
        uses: pr-annotators/flake8-pr-annotator@7300c2d759eb81fb05ffef3e2606967df7c1db69 # v1.0.0
      - name: Add mypy annotator
        uses: pr-annotators/mypy-pr-annotator@275de036f51303e59633fee25cd788dfc8e5841e # v1.0.0
      - name: Get mypy version
        id: mypy-version
        run: |
          echo "MYPY_VERSION=$(mypy --version | awk '{print $2}')" >> $GITHUB_OUTPUT
      - name: Cache mypy
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .mypy_cache
          key: mypy-cache-${{ steps.mypy-version.outputs.MYPY_VERSION }}-${{ github.sha }}
          restore-keys: mypy-cache-${{ steps.mypy-version.outputs.MYPY_VERSION }}-
      - uses: j178/prek-action@1382ad72dea72f9d53832f2bcb65b3e87a947204 # v3.0.1
        with:
          prek-version: '0.5.5'
