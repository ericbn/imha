name: Install Python virtualenv

inputs:
  cache-dependency-path:
    default: 'uv.lock'
  run:
    default: 'uv sync'
  python-version:
    required: true

runs:
  using: composite
  steps:
    - name: Install uv
      uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
      with:
        version: '0.12.23'
        python-version: ${{ inputs.python-version }}
        ignore-nothing-to-cache: true
    - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
      id: setup-python
      with:
        python-version: ${{ inputs.python-version }}
    - uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      id: cache-venv-restore
      with:
        key: venv-${{ runner.os }}-${{ steps.setup-python.outputs.python-version }}-${{ inputs.run }}-${{ hashFiles(inputs.cache-dependency-path) }}
        path: .venv
    - name: Set up virtualenv
      shell: bash
      run: |
        [[ ! -d .venv ]] && uv venv
        echo "VIRTUAL_ENV=${PWD}/.venv" >> ${GITHUB_ENV} && \
        echo "${PWD}/.venv/bin" >> ${GITHUB_PATH}
    - name: Install dependencies
      if: steps.cache-venv-restore.outputs.cache-hit != 'true'
      shell: bash
      run: ${{ inputs.run }}
    - uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      if: steps.cache-venv-restore.outputs.cache-hit != 'true'
      with:
        key: ${{ steps.cache-venv-restore.outputs.cache-primary-key }}
        path: .venv
